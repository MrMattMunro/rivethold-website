<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rivethold</title>
  <meta name="description" content="Rivethold — a steampunk co-op platformer. Coming 2026.">
  <meta property="og:title" content="Rivethold">
  <meta property="og:description" content="A steampunk co-op platformer. Coming 2026.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rivethold.com">
  <style>
    :root {
      --bg: #0e0c0a;
      --ink: #e8d9b0;
      --ink-dim: #8a7e62;
      --rule: #2a2218;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      letter-spacing: 0.01em;
    }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 12vw, 7rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    p.tagline {
      margin: 1.5rem 0 0;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: var(--ink);
      max-width: 32ch;
    }
    p.status {
      margin: 3rem 0 0;
      font-size: 0.95rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }
    hr {
      margin: 4rem auto 1.5rem;
      width: 4rem;
      border: 0;
      border-top: 1px solid var(--rule);
    }
    footer {
      font-size: 0.8rem;
      color: var(--ink-dim);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <h1>Rivethold</h1>
  <p class="tagline">A steampunk co-op platformer.</p>
  <p class="status">Coming 2026</p>
  <hr>
  <footer>Munro Solutions Pty Ltd</footer>
</body>
</html>
